:root{
  --black:#0a0a0a;
  --near-black:#121212;
  --gold:#c9a961;
  --gold-light:#e0c988;
  --cream:#f5f0e6;
  --grey:#9a9a9a;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--black);color:var(--cream);font-family:'Montserrat',sans-serif;line-height:1.7;}
h1,h2,h3,h4{font-family:'Cormorant Garamond',serif;color:var(--gold-light);font-weight:600;letter-spacing:0.5px;}
a{color:var(--gold);text-decoration:none;}
a:hover{color:var(--gold-light);}
.container{max-width:1200px;margin:0 auto;padding:0 24px;}

header.site-header{background:var(--near-black);border-bottom:1px solid rgba(201,169,97,0.25);position:sticky;top:0;z-index:1000;}
nav.main-nav{display:flex;align-items:center;justify-content:space-between;max-width:1200px;margin:0 auto;padding:18px 24px;}
.logo{font-family:'Cormorant Garamond',serif;font-size:1.6rem;color:var(--gold-light);letter-spacing:1px;}
.nav-links{display:flex;gap:32px;list-style:none;}
.nav-links a{color:var(--cream);font-size:0.85rem;text-transform:uppercase;letter-spacing:1.5px;}
.hamburger{display:none;flex-direction:column;gap:5px;cursor:pointer;background:none;border:none;}
.hamburger span{width:26px;height:2px;background:var(--gold);display:block;}
.mobile-menu{display:none;flex-direction:column;background:var(--near-black);padding:20px 24px;gap:16px;}
.mobile-menu.open{display:flex;}
@media(max-width:860px){.nav-links{display:none;} .hamburger{display:flex;}}

.hero{
  background:linear-gradient(135deg, rgba(10,10,10,0.92), rgba(30,25,15,0.85)), radial-gradient(circle at 30% 30%, rgba(201,169,97,0.15), transparent 60%);
  padding:90px 0 60px;text-align:center;border-bottom:1px solid rgba(201,169,97,0.2);
}
.hero .eyebrow{text-transform:uppercase;letter-spacing:3px;color:var(--gold);font-size:0.8rem;margin-bottom:16px;}
.hero h1{font-size:2.7rem;max-width:820px;margin:0 auto 18px;}
.hero p.subtitle{color:var(--grey);max-width:700px;margin:0 auto;font-size:1.05rem;}

.stat-strip{display:flex;justify-content:center;gap:40px;flex-wrap:wrap;padding:36px 24px;border-bottom:1px solid rgba(201,169,97,0.2);background:var(--near-black);}
.stat-strip .stat{text-align:center;}
.stat-strip .stat .num{font-family:'Cormorant Garamond',serif;font-size:1.9rem;color:var(--gold-light);}
.stat-strip .stat .label{font-size:0.75rem;color:var(--grey);text-transform:uppercase;letter-spacing:1px;margin-top:4px;}

.hero-gallery{display:grid;grid-template-columns:2fr 1fr;gap:6px;max-width:1200px;margin:0 auto;padding:0 24px;}
.hero-gallery .main-shot{grid-row:span 2;border-radius:6px;overflow:hidden;}
.hero-gallery .side-shot{border-radius:6px;overflow:hidden;}
.hero-gallery img{width:100%;height:100%;object-fit:cover;display:block;}
.hero-gallery .main-shot img{aspect-ratio:16/11;}
.hero-gallery .side-shot img{aspect-ratio:16/6.7;}
@media(max-width:700px){
  .hero-gallery{grid-template-columns:1fr;}
  .hero-gallery .main-shot{grid-row:auto;}
}

.content figure{margin:24px 0 30px;}
.content figure img{width:100%;border-radius:6px;display:block;}
.content figure figcaption{font-size:0.8rem;color:var(--grey);margin-top:8px;text-align:center;font-style:italic;}
.two-img{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:24px 0 30px;}
.two-img img{width:100%;border-radius:6px;display:block;aspect-ratio:4/3;object-fit:cover;}
@media(max-width:600px){.two-img{grid-template-columns:1fr;}}
